server:
  port: 8080

spring:
  application:
    name: spring-plus

  datasource:
    url: jdbc:mysql://localhost:3306/spring_plus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

# JwtUtil 의 @Value("${jwt.secret.key}") 에 주입되는 값 (Base64 로 인코딩된 HS256 키)
jwt:
  secret:
    key: er2s3Uv/jKVLxffpedYXh1WMTRJ5pCYiwh9apZznWPY=

logging:
  level:
    root: info
    org.example.expert: debug
    JwtUtil: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
